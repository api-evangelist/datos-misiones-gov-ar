aid: datos-misiones-gov-ar
name: datos.misiones.gov.ar
description: >-
  datos.misiones.gov.ar is a open data portal open-data portal for Argentina running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 2 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
